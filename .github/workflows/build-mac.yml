name: Build Mac Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download ffmpeg (macOS)
        run: |
          curl -L https://www.osxexperts.net/ffmpeg7arm.zip -o ffmpeg.zip
          unzip ffmpeg.zip -d src/main/resources/ffmpeg/mac-arm64

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mac app
        run: ./gradlew packageMacApp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBridgeApp-mac
          path: bridge/build/dist/**
