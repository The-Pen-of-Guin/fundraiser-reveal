plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

project.ext.lwjglVersion = "3.3.6"
project.ext.lwjglNatives = System.getProperty('os.name').toLowerCase().contains('mac') ?
    (System.getProperty('os.arch').startsWith('aarch64') ? 'natives-macos-arm64' : 'natives-macos') :
    'natives-linux'

repositories {
	mavenCentral()
}

def joglVersion = '2.6.0'
def mapstructVersion = '1.6.3'
def springOpenApiVersion = '2.8.5'

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springOpenApiVersion"

    implementation "org.mapstruct:mapstruct:$mapstructVersion"
    annotationProcessor "org.mapstruct:mapstruct-processor:$mapstructVersion"

    implementation project(':bezalel')
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.fundraiser.bridge.BridgeApplication'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

def clientDir = file("$projectDir/../client/")

tasks.register('npmInstallClient', Exec) {
    workingDir clientDir
    inputs.file(new File(clientDir, "package.json"))
    outputs.dir(new File(clientDir, "node_modules"))

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm install'
    } else {
        commandLine 'npm', 'install'
    }
}

// 2. Run Vite build inside the client directory
tasks.register('npmBuildClient', Exec) {
    dependsOn npmInstallClient
    workingDir clientDir
    inputs.dir(clientDir)
    outputs.dir(new File(clientDir, "dist")) 
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

// 3. Inject the client's build files directly into the bridge's static resources
processResources {
    dependsOn npmBuildClient
    from(new File(clientDir, "dist")) {
        into "static"
    }
}

tasks.register('packageMacApp', Exec) {
    dependsOn bootJar // Ensures the latest JAR is built first
    
    // Define input and output paths
    def jarName = bootJar.archiveFileName.get()
    def inputDir = bootJar.destinationDirectory.get().asFile.absolutePath
    def outputDir = "${buildDir}/dist"

    workingDir projectDir
    
    // Run the native JDK jpackage tool
    commandLine 'jpackage',
        '--type', 'app-image',      // Generates a standard Mac .app folder structure
        '--input', inputDir,        // Where your Spring Boot JAR lives
        '--dest', outputDir,        // Where to save the output .app
        '--name', 'MyBridgeApp',     // The name of your executable Mac App
        '--main-jar', jarName,      // The name of your JAR file
        '--main-class', 'org.springframework.boot.loader.launch.JarLauncher', // Spring Boot's internal launcher
        '--java-options', '-XstartOnFirstThread'
        '--app-content', "${projectDir}../bezalel/src/main/resources/ffmpeg/mac-arm64"
}

